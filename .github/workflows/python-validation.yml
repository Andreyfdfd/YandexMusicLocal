name: Python validation

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile canonical entry point
        run: python -m py_compile main.py

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Smoke-test module imports
        run: python -c "import main; print('main.py imported successfully')"

      - name: Validate PowerShell updater syntax and origin URLs
        shell: pwsh
        run: |
          $scriptPath = Join-Path $PWD 'scripts/update-local.ps1'
          $tokens = $null
          $parseErrors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
              throw 'PowerShell syntax validation failed for scripts/update-local.ps1'
          }

          $examples = @(
              'https://github.com/Andreyfdfd/YandexMusicLocal.git',
              'https://github.com/Andreyfdfd/YandexMusicLocal',
              'git@github.com:Andreyfdfd/YandexMusicLocal.git',
              'ssh://git@github.com/Andreyfdfd/YandexMusicLocal.git'
          )
          foreach ($origin in $examples) {
              $repoPath = ''
              if ($origin.StartsWith('https://github.com/', [System.StringComparison]::OrdinalIgnoreCase)) {
                  $repoPath = $origin.Substring('https://github.com/'.Length)
              } elseif ($origin.StartsWith('http://github.com/', [System.StringComparison]::OrdinalIgnoreCase)) {
                  $repoPath = $origin.Substring('http://github.com/'.Length)
              } elseif ($origin.StartsWith('git@github.com:', [System.StringComparison]::OrdinalIgnoreCase)) {
                  $repoPath = $origin.Substring('git@github.com:'.Length)
              } elseif ($origin.StartsWith('ssh://git@github.com/', [System.StringComparison]::OrdinalIgnoreCase)) {
                  $repoPath = $origin.Substring('ssh://git@github.com/'.Length)
              }
              $repoPath = ($repoPath -replace '(?i)\.git$', '').TrimEnd('/')
              if ($repoPath -ine 'Andreyfdfd/YandexMusicLocal') {
                  throw "Origin parse failed: $origin -> $repoPath"
              }
          }
          Write-Host 'Updater syntax and origin formats validated.' -ForegroundColor Green

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build Windows GUI executable
        run: python -m PyInstaller --noconfirm --clean --distpath dist-staging --workpath build-staging "Local Music.spec"

      - name: Verify packaged executable
        shell: pwsh
        run: |
          $exe = 'dist-staging\YandexMusicLocal\YandexMusicLocal.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
              throw "PyInstaller did not produce the expected GUI executable: $exe"
          }
          Write-Host "Executable package created: $exe" -ForegroundColor Green

      - name: Smoke-test packaged Windows executable
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist-staging\\YandexMusicLocal\\YandexMusicLocal.exe').Path
          $process = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          try {
              Start-Sleep -Seconds 8
              $process.Refresh()
              if ($process.HasExited) {
                  throw "Packaged executable exited during startup (exit code $($process.ExitCode))."
              }
              Write-Host "Packaged GUI stayed running after startup." -ForegroundColor Green
          } finally {
              if (-not $process.HasExited) {
                  Stop-Process -Id $process.Id -Force
                  Wait-Process -Id $process.Id -Timeout 10 -ErrorAction SilentlyContinue
              }
          }

      - name: Upload Windows application package
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v4
        with:
          name: Local-Music-Windows-Package
          path: dist-staging/YandexMusicLocal/
          if-no-files-found: error
          retention-days: 14
