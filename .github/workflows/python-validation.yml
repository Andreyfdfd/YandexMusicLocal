name: Python validation

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile canonical entry point
        run: python -m py_compile main.py

      - name: Run scanner regression tests
        run: python -m unittest discover -s tests -v

      - name: Smoke-test module imports
        run: python -c "import main; print('main.py imported successfully')"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build Windows GUI executable
        run: python -m PyInstaller --noconfirm --clean --distpath dist-staging --workpath build-staging "Local Music.spec"

      - name: Verify packaged executable
        shell: pwsh
        run: |
          $exe = 'dist-staging\YandexMusicLocal\YandexMusicLocal.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
              throw "PyInstaller did not produce the expected GUI executable: $exe"
          }
          Write-Host "Executable package created: $exe" -ForegroundColor Green
